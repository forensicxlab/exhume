[package]
name = "exhume_grep"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Streaming file-content search over Exhume indexed evidence"
repository = "https://github.com/forensicxlab/exhume"
documentation = "https://docs.rs/exhume_grep"
license = "GPL-3.0-only"
readme = "README.md"
authors = ["k1nd0ne"]
keywords = ["forensics", "dfir", "search", "grep", "exhume"]
categories = ["command-line-utilities", "filesystem", "text-processing"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[dependencies]
exhume_body = "=0.5.7"
exhume_filesystem = "=0.5.6"
aho-corasick = "1.1"
memchr = "2.8"
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
futures-util = "0.3"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
signal-hook = "0.3"

[dev-dependencies]
exhume_indexer = "=0.2.4"
tempfile = "3"
