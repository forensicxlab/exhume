name: Toolkit CI and releases
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish after every check and all native builds pass
        type: choice
        options: [none, rolling, stable]
        default: none
      tag:
        description: Stable umbrella snapshot tag (toolkit-*)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: toolkit-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.channel != 'stable' }}
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/toolkit-'))) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.channel != 'none')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish a complete verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/toolkit-') && 'stable' || inputs.channel == 'stable' && 'stable' || 'rolling' }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python scripts/release.py publish --channel "$RELEASE_CHANNEL" --tag "$RELEASE_TAG"
